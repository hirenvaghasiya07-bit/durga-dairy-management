<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b4a6f"><link rel="manifest" href="manifest.json"><title>Durga Dairy Management</title><style>
:root{--nav:#083b5c;--blue:#0b78c8;--green:#0f9d6e;--orange:#f59e0b;--red:#e05252;--purple:#7657c8;--bg:#f4f7fb;--card:#fff;--text:#17212b;--muted:#6b7785;--line:#dfe6ee;--shadow:0 8px 25px #16324d12}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:245px;background:var(--nav);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:20px;font-weight:800;padding:8px 10px 22px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.7;margin-top:3px}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#dceaf5;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);min-width:0}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:4}.topbar .right{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dcefff;color:#0b4a6f;font-weight:800}.page{padding:22px;max-width:1600px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.metric .label{font-size:12px;color:var(--muted);font-weight:700}.metric .value{font-size:24px;font-weight:800;margin-top:7px}.metric .sub{font-size:11px;color:var(--muted);margin-top:5px}.section{margin-top:18px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}.sectionhead h2{font-size:17px;margin:0}.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:700}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.red{background:var(--red)}.btn.gray{background:#e9eef4;color:#24313e}.btn.sm{padding:7px 9px;font-size:12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.charts{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}.chartbar{height:180px;display:flex;align-items:flex-end;gap:10px;padding:20px 5px 4px}.bar{flex:1;min-width:15px;border-radius:7px 7px 2px 2px;background:#79bce9;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:var(--muted)}.donut{width:155px;height:155px;border-radius:50%;margin:5px auto 12px;background:conic-gradient(#0b78c8 0 35%,#f59e0b 35% 60%,#7657c8 60% 78%,#0f9d6e 78% 91%,#e05252 91% 100%);display:grid;place-items:center}.donut:after{content:'Sales';width:88px;height:88px;background:#fff;border-radius:50%;display:grid;place-items:center;font-weight:800}.legend{display:grid;gap:5px;font-size:12px}.legend span{display:flex;justify-content:space-between}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}.table th{background:#f7f9fc;color:#5e6b78;font-size:11px;text-transform:uppercase}.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#eaf3fb;color:#0b68a8}.pill.green{background:#e6f7f0;color:#087d57}.pill.red{background:#fdecec;color:#a53535}.pill.orange{background:#fff3dc;color:#9a6200}.empty{padding:25px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field label{display:block;font-size:11px;font-weight:800;color:#5f6d7a;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;outline:none}.field textarea{min-height:70px;resize:vertical}.span2{grid-column:span 2}.span4{grid-column:1/-1}.muted{color:var(--muted);font-size:12px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:8px;font-size:12px}.tabs button.active{background:#0b78c8;color:#fff;border-color:#0b78c8}.modal{position:fixed;inset:0;background:#071b2d99;display:grid;place-items:center;z-index:20;padding:18px}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h3{margin:0}.x{border:0;background:#eef2f6;border-radius:50%;width:32px;height:32px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#083b5c,#0b78c8);padding:20px}.loginbox{width:min(420px,100%);background:#fff;border-radius:20px;padding:28px;box-shadow:0 20px 60px #001c2d55}.loginbox h1{margin:0 0 4px}.loginbox p{color:var(--muted);font-size:13px}.loginbox .field{margin-top:12px}.notice{background:#eef7ff;border:1px solid #cfe8fb;border-radius:10px;padding:10px;font-size:12px;color:#265b7e}.mobileOnly{display:none}.kpiGood{color:#087d57}.kpiBad{color:#a53535}.right{text-align:right}.small{font-size:11px}.footer{padding:25px 0;color:var(--muted);font-size:11px;text-align:center}.menuBtn{display:none;border:0;background:transparent;font-size:22px}.dangerText{color:#a53535}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.grid6{grid-template-columns:repeat(3,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}.span4{grid-column:1/-1}}
@media(max-width:720px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.menuBtn{display:block}.mobileOnly{display:block}.topbar{padding:0 12px}.page{padding:14px}.grid,.grid6,.two,.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.topbar .right .workspace{display:none}.metric .value{font-size:20px}.toolbar .btn{flex:1}.table{min-width:720px}}
.linkbtn{display:block;margin:10px auto 0;border:0;background:transparent;color:#0b78c8;font-weight:700;cursor:pointer}.notice{line-height:1.45}</style></head><body><div id="root"></div><script src="config.js"></script><script src="app.js"></script></body></html>
