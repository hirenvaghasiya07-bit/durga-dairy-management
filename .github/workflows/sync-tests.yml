name: Durga Dairy Safety Checks

on:
  push:
    branches: ["main", "safety/**"]
  pull_request:
    branches: ["main"]

jobs:
  sync-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend syntax
        run: node --check public/app.js
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Run sync safety tests
        run: node --test tests/sync-invariants.test.mjs
